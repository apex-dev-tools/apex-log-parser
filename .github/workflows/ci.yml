name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run typecheck:scripts
      - run: pnpm run test
      # tsdown 0.22 needs Node ^22.18 || >=24.11, but the library itself still supports 20.
      # Lint, typecheck and test cover every version; the bundle only needs building once.
      - if: matrix.node-version == 24
        run: pnpm run build

  ci:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check: $RESULT"
          [ "$RESULT" = 'success' ] || exit 1
