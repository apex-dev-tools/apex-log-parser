name: Release
on:
  push:
    branches: [main]
  # A startup_failure run cannot be re-run, and push-only recovery needs a new commit
  # on main. Dispatch retries the same commit after a setting is fixed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC, for npm trusted publishing and provenance

jobs:
  release:
    if: github.repository == 'apex-dev-tools/apex-log-parser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # tsdown 0.22 (build, prepublishOnly) needs ^22.18 || >=24.11; 24.11+ bundles the npm 11.5.1+ OIDC needs.
          node-version: '^24.11'
          cache: pnpm
          # No registry-url: .npmrc already names the registry, and OIDC needs no token line.
      - run: pnpm install --frozen-lockfile
      # ci.yml gates the pull request; this re-checks the merge commit itself,
      # because a publish cannot be taken back.
      - run: pnpm run ci
      - run: pnpm run build
      - uses: changesets/action@v2
        with:
          # Not plain `changeset version`: it rewrites package.json with 2-space JSON,
          # which expands the short arrays Biome keeps inline. The script reformats after.
          version-script: pnpm run version:packages
          publish-script: pnpm changeset publish
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
