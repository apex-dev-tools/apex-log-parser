name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'apex-dev-tools/apex-debug-log-parser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # tsdown 0.22 needs Node ^22.18 || >=24.11, and both `build` here and
          # `prepublishOnly` in the publish step run it.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # ci.yml gates the pull request; this re-checks the merge commit itself,
      # because a publish cannot be taken back.
      - run: pnpm run ci
      - run: pnpm run build
      - uses: changesets/action@v1
        with:
          # Not plain `changeset version`: it rewrites package.json with 2-space JSON,
          # which expands the short arrays Biome keeps inline. The script reformats after.
          version: pnpm run version:packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
