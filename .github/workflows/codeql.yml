name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  schedule:
    - cron: '26 5 * * 3' # weekly, Wednesday 05:26 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # TEMPORARY: code scanning needs Advanced Security on a private repository, so every run
    # fails. Delete the visibility term below once this repository is public, where CodeQL is
    # free. github.event.repository is undocumented for schedule events, so that term also
    # skips the weekly run; push and pull_request still scan.
    if: >-
      github.repository == 'apex-dev-tools/apex-log-parser' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
