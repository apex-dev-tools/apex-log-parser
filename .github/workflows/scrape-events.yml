name: Scrape Debug Log Events

on:
  schedule:
    - cron: '0 9 1 3,7,11 *'
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Salesforce API version (e.g. 67). Empty means the current GA release.'
        required: false
        type: string
  workflow_call:
    inputs:
      api_version:
        description: 'Salesforce API version. Empty means the current GA release.'
        required: false
        type: string
      branch:
        description: 'Branch the automation opens its pull request on. Empty means auto/scrape-debug-log-events.'
        required: false
        type: string
    outputs:
      changed:
        description: 'Whether data/ changed on this run.'
        value: ${{ jobs.scrape.outputs.changed }}
      pull_request:
        description: 'Number of the pull request opened or updated, empty when none.'
        value: ${{ jobs.scrape.outputs.pull_request }}

permissions:
  contents: read

jobs:
  scrape:
    if: github.repository == 'apex-dev-tools/apex-log-parser'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.report.outputs.changed }}
      pull_request: ${{ steps.pr.outputs.pull-request-number }}
    env:
      SEED_BRANCH: ${{ inputs.branch || 'auto/scrape-debug-log-events' }}
      SCRAPE_API_VERSION: ${{ inputs.api_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci:seed

      - run: pnpm scrape -- --report="$RUNNER_TEMP/scrape-run.json"

      - name: Validate the event database
        id: validate
        continue-on-error: true
        run: pnpm run validate:data

      - name: Lint, typecheck and test
        id: verify
        continue-on-error: true
        run: pnpm run ci

      - name: Report
        id: report
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: pnpm run ci:report -- --report="$RUNNER_TEMP/scrape-run.json" --out="$RUNNER_TEMP/pr-body.md"

      - name: Create or update the pull request
        id: pr
        if: steps.report.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): update debug log events'
          branch: ${{ env.SEED_BRANCH }}
          title: 'chore(data): update debug log events [auto]'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: automated,data
          delete-branch: true
          add-paths: data/

      - name: Raise a recorded failure
        if: steps.report.outputs.ok != 'true'
        run: exit 1
