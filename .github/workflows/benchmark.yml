name: Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per push: a shared group drops a pending main run, and with it a baseline.
concurrency:
  group: bench-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact, because instruction counts move with the V8 version. Bump on purpose.
  NODE_VERSION: '24.21.0'

jobs:
  benchmarks:
    if: github.repository == 'apex-dev-tools/apex-log-parser'
    # Exact, for the same reason as NODE_VERSION: a new OS image moves instruction counts.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: CodSpeedHQ/action@v5
        with:
          # CPU instructions, then memory: the action runs `run` once per mode.
          mode: simulation,memory
          # Not `pnpm run`: under valgrind, pnpm starts far slower than `node --run`.
          run: node --run bench
