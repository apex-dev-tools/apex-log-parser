version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    commit-message:
      prefix: 'build'
      include: 'scope'
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # The bench plugin pins vitest's range, so they move together.
      vitest:
        patterns: ['vitest', '@codspeed/*']
      development-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: ['minor', 'patch']
