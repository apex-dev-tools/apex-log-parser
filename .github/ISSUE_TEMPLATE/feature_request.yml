name: ✨ Feature Request
description: Suggest a new feature or improvement
title: '✨ feat: <title>'
type: 'Feature'
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Have an early idea or open question? Consider starting a
        [discussion](https://github.com/apex-dev-tools/apex-debug-log-parser/discussions)
        first. Otherwise, search
        [existing issues](https://github.com/apex-dev-tools/apex-debug-log-parser/issues)
        to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What use case do you have?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried?
