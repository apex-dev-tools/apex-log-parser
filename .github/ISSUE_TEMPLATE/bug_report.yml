name: 🐛 Bug Report
description: Report a parsing error or unexpected behaviour
title: '🐛 bug: <title>'
type: 'Bug'
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the parser! Please search
        [existing issues](https://github.com/apex-dev-tools/apex-log-parser/issues)
        first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages.
    validations:
      required: true
  - type: textarea
    id: log-snippet
    attributes:
      label: Debug log snippet
      description: >
        The relevant portion of the Apex debug log that triggers the issue.
        Redact any sensitive data.
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code that reproduces the issue.
      render: typescript
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 20.11.0
